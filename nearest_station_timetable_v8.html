<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>最寄り駅 時刻表</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;
  --line:#e5e5ea;--blue:#007aff;--blue2:#eaf3ff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.055);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;
-webkit-font-smoothing:antialiased}
button,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.86);
backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
border-bottom:1px solid rgba(0,0,0,.07)}
.topbar-inner{max-width:760px;margin:auto;height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:17px;font-weight:750;letter-spacing:-.02em}
.brand-sub{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--sub);margin-bottom:1px}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.06);color:var(--text);
display:grid;place-items:center;font-size:20px;cursor:pointer}
main{max-width:760px;margin:auto;padding:18px 16px 40px}
.hero{padding:8px 4px 18px}
.eyebrow{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.route{font-size:32px;line-height:1.13;font-weight:800;letter-spacing:-.045em;min-height:38px}
.route-arrow{color:#a1a1a6;margin:0 5px}
.route-sub{margin-top:8px;font-size:13px;color:var(--sub)}
.direction{display:flex;background:#e9e9ee;border-radius:13px;padding:3px;margin-top:16px}
.direction button{flex:1;border:0;background:transparent;color:#6e6e73;border-radius:10px;padding:9px 5px;font-weight:700;font-size:14px;cursor:pointer}
.direction button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card{background:var(--card);border-radius:20px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.next-head{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:end}
.next-title{font-size:20px;font-weight:800;letter-spacing:-.02em}
.now{font-size:12px;color:var(--sub)}
#loading{padding:0 18px 12px;color:var(--sub);font-size:13px;display:none}
#trains{transition:opacity .16s ease}
#trains.loading{opacity:.55}
.trains{padding:0 14px 14px}
.train{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;padding:16px 6px;border-top:1px solid var(--line)}
.train:first-child{border-top:0}
.time{font-size:27px;font-weight:800;letter-spacing:-.04em}
.train-main{min-width:0}
.train-dest{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.train-meta{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.countdown{font-size:12px;color:var(--blue);font-weight:700;text-align:right;white-space:nowrap}
.arrival{font-size:11px;color:var(--sub);margin-top:3px;text-align:right}
.notice{margin:0 14px 14px;padding:13px 14px;border-radius:14px;background:#f2f2f7;color:#6e6e73;font-size:13px;line-height:1.5}
.error{background:#fff0f0;color:#9b1c1c}
.action-row{display:flex;gap:8px;padding:0 14px 14px}
.action{flex:1;border:0;border-radius:14px;padding:12px;background:#f2f2f7;color:var(--text);font-weight:700;cursor:pointer}
.action.primary{background:var(--blue);color:#fff}
.accordion{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.accordion>button{width:100%;border:0;background:transparent;text-align:left;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;color:var(--text);cursor:pointer}
.acc-left{display:flex;align-items:center;gap:12px}
.acc-icon{width:32px;height:32px;border-radius:10px;background:#f2f2f7;display:grid;place-items:center;font-size:16px}
.acc-title{font-size:16px;font-weight:750}
.acc-sub{font-size:12px;color:var(--sub);margin-top:2px}
.chev{font-size:20px;color:#a1a1a6;transition:transform .18s}
.accordion.open .chev{transform:rotate(90deg)}
.panel{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.accordion.open .panel{display:block}
.settings-note{font-size:12px;color:var(--sub);line-height:1.55;padding:14px 0 6px}
.rule-row{padding:13px 0;border-bottom:1px solid var(--line)}
.rule-row:last-child{border-bottom:0}
.rule-name{font-size:14px;font-weight:750;margin-bottom:9px}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rule-label{font-size:11px;color:var(--sub);margin:0 0 5px 2px}
.rule-select{width:100%;border:1px solid #d2d2d7;border-radius:12px;background:#fff;padding:11px 10px;color:var(--text)}
.setting-actions{display:flex;gap:8px;margin-top:14px}
.setting-actions button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:750;cursor:pointer}
.save{background:var(--blue);color:#fff} .reset{background:#f2f2f7;color:var(--text)}
.location-line{display:flex;justify-content:space-between;align-items:center;padding:13px 0}
.location-main{font-weight:750} .location-sub{font-size:12px;color:var(--sub);margin-top:4px}
.link-btn{border:0;background:transparent;color:var(--blue);font-weight:700;padding:8px;cursor:pointer}
.small{font-size:12px;color:var(--sub);line-height:1.65;padding-top:13px}
.official{display:block;text-align:center;color:var(--blue);font-weight:700;text-decoration:none;padding:12px 0 2px}
.empty{padding:20px 6px;color:var(--sub);font-size:14px;text-align:center}
@media(max-width:480px){
  main{padding:14px 12px 34px}
  .route{font-size:29px}
  .train{grid-template-columns:78px 1fr}
  .countdown,.arrival{grid-column:2;text-align:left}
  .countdown{margin-top:-8px}
  .rule-grid{grid-template-columns:1fr}
}
</style>

<style id="liquid-glass-v8">
:root{
  --bg:#eef2f8;--card:rgba(255,255,255,.58);--card-strong:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.62);--blue:#007aff;
}
body{
  background:
    radial-gradient(circle at 15% 8%,rgba(255,255,255,.95),transparent 34%),
    radial-gradient(circle at 88% 18%,rgba(160,205,255,.42),transparent 32%),
    radial-gradient(circle at 50% 95%,rgba(210,190,255,.30),transparent 38%),
    #eef2f8;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 38%,rgba(255,255,255,.14));z-index:-1}
.topbar{
  background:rgba(248,250,255,.62)!important;
  border-bottom:1px solid rgba(255,255,255,.7)!important;
  box-shadow:0 8px 28px rgba(35,55,90,.08)!important;
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
}
.card,.accordion{
  background:var(--card)!important;
  border:1px solid var(--line)!important;
  box-shadow:0 14px 38px rgba(31,49,82,.10),inset 0 1px 0 rgba(255,255,255,.75)!important;
  backdrop-filter:blur(24px) saturate(165%);-webkit-backdrop-filter:blur(24px) saturate(165%);
}
.route-card{background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(232,241,255,.52))!important}
button,.segmented,.select-wrap select{
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
}
.segmented{background:rgba(255,255,255,.38)!important;border:1px solid rgba(255,255,255,.7)!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)!important}
.segmented button.active{background:rgba(255,255,255,.82)!important;box-shadow:0 4px 14px rgba(30,70,130,.13),inset 0 1px 0 rgba(255,255,255,.9)!important}
.settings-btn{
  display:grid!important;place-items:center!important;
  padding:0!important;line-height:1!important;
  text-align:center!important;
  box-sizing:border-box!important;
}
.settings-btn svg,.settings-btn img{display:block!important;margin:0!important;position:static!important;transform:none!important}
button{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
button:active{transform:scale(.97)}
@media(prefers-reduced-transparency:reduce){.topbar,.card,.accordion{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.94)!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-sub">STATION TIMETABLE</span>最寄り駅 時刻表</div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙︎</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow" id="stationLabel">最寄り駅を確認中</div>
    <div class="route" id="route">現在地から検索中…</div>
    <div class="route-sub" id="routeSub">現在地から最寄り駅を自動判定しています</div>
    <div class="direction">
      <button id="outbound" class="active">行き</button>
      <button id="return">帰り</button>
    </div>
  </section>

  <section class="card">
    <div class="next-head">
      <div class="next-title">次の電車</div>
      <div class="now" id="now">—</div>
    </div>
    <div id="loading">時刻表を更新しています…</div>
    <div class="trains" id="trains"><div class="empty">現在地を取得しています</div></div>
    <div class="action-row">
      <button class="action" id="refresh">↻ 更新</button>
      <button class="action primary" id="officialBtn" style="display:none">公式時刻表</button>
    </div>
  </section>

  <section class="accordion" id="locationAcc">
    <button class="acc-head">
      <div class="acc-left"><div class="acc-icon">⌖</div><div><div class="acc-title">現在地・最寄り駅</div><div class="acc-sub" id="locationSummary">自動判定</div></div></div>
      <div class="chev">›</div>
    </button>
    <div class="panel">
      <div class="location-line">
        <div><div class="location-main" id="station">未取得</div><div class="location-sub" id="distance">—</div></div>
        <button class="link-btn" id="locate">再取得</button>
      </div>
      <div class="notice" id="locationMsg" style="margin:0">位置情報を取得すると最寄り駅を判定します。</div>
    </div>
  </section>

  <section class="accordion" id="settingsAcc">
    <button class="acc-head">
      <div class="acc-left"><div class="acc-icon">⚙︎</div><div><div class="acc-title">駅ごとの行き先</div><div class="acc-sub">行き・帰りを駅ごとに設定</div></div></div>
      <div class="chev">›</div>
    </button>
    <div class="panel">
      <div class="settings-note">最寄り駅として使うのは、みらい平・守谷・竜ヶ崎・龍ケ崎市・取手の5駅だけです。ここで駅ごとの「行き」「帰り」の行き先を自由に変更できます。</div>
      <div id="rules"></div>
      <div class="setting-actions">
        <button class="reset" id="reset">初期設定</button>
        <button class="save" id="save">保存して反映</button>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="acc-head">
      <div class="acc-left"><div class="acc-icon">ⓘ</div><div><div class="acc-title">データについて</div><div class="acc-sub">時刻表データ・注意事項</div></div></div>
      <div class="chev">›</div>
    </button>
    <div class="panel">
      <div class="small">
        次の電車は公開交通データを利用した経路検索APIから取得します。実際の遅延・運休を完全には反映しない場合があります。最終確認は鉄道会社の公式時刻表をご利用ください。
        <br><br><a href="https://api.transit.ls8h.com/" target="_blank" rel="noopener">Transit API</a>
      </div>
    </div>
  </section>
</main>

<script>
const API="https://api.transit.ls8h.com/api/v1";
const stations=[
  {name:"みらい平駅",lat:35.9979,lon:140.0377,official:"https://www.mir.co.jp/route_map/miraidaira/"},
  {name:"守谷駅",lat:35.9516,lon:140.0006,official:"https://www.mir.co.jp/route_map/moriya/"},
  {name:"竜ヶ崎駅",lat:35.9105,lon:140.1908,official:"https://www.kantetsu.co.jp/train/station/ryugasaki"},
  {name:"龍ケ崎市駅",lat:35.9272,lon:140.1371,official:"https://www.jreast.co.jp/estation/station/info.aspx?StationCd=1684"},
  {name:"取手駅",lat:35.895,lon:140.0633,official:"https://www.jreast.co.jp/estation/station/info.aspx?StationCd=1057"}
];

const defaultRules={
  outbound:{"みらい平駅":"守谷駅","守谷駅":"取手駅","竜ヶ崎駅":"龍ケ崎市駅","龍ケ崎市駅":"竜ヶ崎駅","取手駅":"守谷駅"},
  inbound:{"みらい平駅":"守谷駅","守谷駅":"みらい平駅","竜ヶ崎駅":"龍ケ崎市駅","龍ケ崎市駅":"竜ヶ崎駅","取手駅":"守谷駅"}
};
let rules=JSON.parse(localStorage.getItem("stationRulesV6")||"null")||JSON.parse(JSON.stringify(defaultRules));
let mode="outbound", currentStation=null, fromNameGlobal="", toNameGlobal="";

const $=id=>document.getElementById(id);
const destinationNames=()=>stations.map(s=>s.name);

function hav(a,b){
  const R=6371000,p=Math.PI/180,x=(b.lat-a.lat)*p,y=(b.lon-a.lon)*p;
  const q=Math.sin(x/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(q));
}
function nearest(lat,lon){
  let best=null;
  for(const s of stations){const d=hav({lat,lon},s);if(!best||d<best.d)best={s,d};}
  return best;
}
function fillSelect(sel,value){
  sel.innerHTML=stations.map(s=>`<option value="${s.name}" ${s.name===value?"selected":""}>${s.name}</option>`).join("");
}
function renderRules(){
  const box=$("rules"); box.innerHTML="";
  stations.forEach(s=>{
    const row=document.createElement("div"); row.className="rule-row";
    const o=rules.outbound[s.name]||"";
    const i=rules.inbound[s.name]||"";
    row.innerHTML=`<div class="rule-name">${s.name}</div>
      <div class="rule-grid">
        <div><div class="rule-label">行き</div><select class="rule-select" data-dir="outbound" data-station="${s.name}"></select></div>
        <div><div class="rule-label">帰り</div><select class="rule-select" data-dir="inbound" data-station="${s.name}"></select></div>
      </div>`;
    box.appendChild(row);
    fillSelect(row.querySelector('[data-dir="outbound"]'),o);
    fillSelect(row.querySelector('[data-dir="inbound"]'),i);
  });
}
function saveRules(){
  document.querySelectorAll(".rule-select").forEach(sel=>{
    rules[sel.dataset.dir][sel.dataset.station]=sel.value;
  });
  localStorage.setItem("stationRulesV6",JSON.stringify(rules));
}
function setMode(m){
  if(mode===m)return;
  mode=m;
  $("outbound").classList.toggle("active",m==="outbound");
  $("return").classList.toggle("active",m==="inbound");
  applyDirection();
}
function applyDirection(){
  if(!currentStation)return;
  const dest=rules[mode][currentStation.name];
  $("routeSub").textContent=mode==="outbound"?"行きの設定":"帰りの設定";
  if(dest){
    fromNameGlobal=currentStation.name; toNameGlobal=dest;
    $("route").innerHTML=`${fromNameGlobal} <span class="route-arrow">→</span> ${toNameGlobal}`;
    loadTimetable();
  }else{
    $("route").textContent=currentStation.name;
    $("routeSub").textContent="この方向の設定がありません。設定から行き先を選んでください";
    $("trains").innerHTML='<div class="empty">設定から行き先を選択してください</div>';
  }
}
function formatSecs(sec){
  let day=Math.floor(sec/86400); sec=((sec%86400)+86400)%86400;
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}${day?` (+${day}日)`:""}`;
}
function todayJST(){
  const d=new Date(),p=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d);
  const o={};p.forEach(x=>o[x.type]=x.value);
  return {date:`${o.year}${o.month}${o.day}`,time:`${o.hour}:${o.minute}:${o.second}`};
}
async function suggestStation(name){
  const r=await fetch(`${API}/locations/suggest?q=${encodeURIComponent(name)}&limit=10`);
  if(!r.ok)throw new Error("駅検索に失敗しました");
  const j=await r.json(),arr=j.stations||j.locations||[];
  return arr.find(x=>x.name===name)||arr.find(x=>(x.name||"").replace(/駅$/,"")===(name||"").replace(/駅$/,""))||arr[0];
}
async function getTrains(fromName,toName){
  const [from,to]=await Promise.all([suggestStation(fromName),suggestStation(toName)]);
  if(!from?.id||!to?.id)throw new Error("駅IDを取得できませんでした");
  const jt=todayJST();
  const q=new URLSearchParams({from:from.id,to:to.id,date:jt.date,time:jt.time,type:"departure",numItineraries:"6",maxTransfers:"0"});
  const r=await fetch(`${API}/plan?${q}`);
  if(!r.ok)throw new Error("経路検索に失敗しました");
  return r.json();
}
function minsUntil(sec){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  const nowSec=h*3600+m*60+s;
  let d=sec%86400; if(d<nowSec)d+=86400;
  return Math.max(0,Math.round((d-nowSec)/60));
}
function renderTrains(j){
  const box=$("trains");box.innerHTML="";
  const journeys=(j.journeys||[]).filter(x=>x&&typeof x.departureSecs==="number");
  if(!journeys.length){box.innerHTML='<div class="notice error">次の電車が見つかりませんでした。公式時刻表で確認してください。</div>';return;}
  journeys.slice(0,5).forEach((x,i)=>{
    const transit=(x.legs||[]).find(l=>l.kind==="transit");
    const type=transit?.trainType||"",line=transit?.routeName||"",head=transit?.headsign||"";
    const dur=(typeof x.arrivalSecs==="number"&&typeof x.departureSecs==="number")?Math.max(0,Math.round((x.arrivalSecs-x.departureSecs)/60)):0;
    const el=document.createElement("div");el.className="train";
    const wait=minsUntil(x.departureSecs);
    el.innerHTML=`<div class="time">${formatSecs(x.departureSecs)}</div>
      <div class="train-main"><div class="train-dest">${toNameGlobal}</div>
      <div class="train-meta">${type||"電車"}${line?"・"+line:""}${head?"・"+head:""}${dur?"・約"+dur+"分":""}</div></div>
      <div><div class="countdown">${i===0?"次の電車":"次々発"}${wait>0?"・あと"+wait+"分":""}</div><div class="arrival">到着 ${formatSecs(x.arrivalSecs)}</div></div>`;
    box.appendChild(el);
  });
}
async function loadTimetable(){
  if(!currentStation)return;
  const to=rules[mode][currentStation.name];
  if(!to)return;
  fromNameGlobal=currentStation.name;toNameGlobal=to;
  $("route").innerHTML=`${fromNameGlobal} <span class="route-arrow">→</span> ${toNameGlobal}`;
  $("now").textContent=`現在 ${todayJST().time}`;
  $("loading").style.display="block";
  $("trains").classList.add("loading");
  const s=stations.find(x=>x.name===currentStation.name);
  if(s){$("officialBtn").style.display="block";$("officialBtn").onclick=()=>window.open(s.official,"_blank");}
  try{renderTrains(await getTrains(fromNameGlobal,toNameGlobal));}
  catch(e){$("trains").innerHTML=`<div class="notice error">次の電車を自動取得できませんでした。<br>${e.message}<br><br>公式時刻表で確認してください。</div>`;}
  finally{
  $("loading").style.display="none";
  $("trains").classList.remove("loading");
}
}
function locate(){
  if(!navigator.geolocation){$("locationMsg").textContent="このブラウザでは位置情報を利用できません。";return;}
  $("locationMsg").textContent="位置情報を取得中…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const n=nearest(pos.coords.latitude,pos.coords.longitude);
    currentStation={...n.s};
    $("station").textContent=currentStation.name;
    $("distance").textContent=`現在地から約 ${Math.round(n.d)} m`;
    $("locationSummary").textContent=currentStation.name;
    $("stationLabel").textContent=`最寄り駅・${currentStation.name}`;
    $("routeSub").textContent=mode==="outbound"?"行きの設定":"帰りの設定";
    $("locationMsg").textContent="位置情報を取得しました。";
    applyDirection();
  },()=>{$("locationMsg").textContent="位置情報を取得できませんでした。Safariの位置情報許可を確認してください。";},
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
document.querySelectorAll(".acc-head").forEach(b=>b.addEventListener("click",()=>b.parentElement.classList.toggle("open")));
$("settingsBtn").onclick=()=>{
  const a=$("settingsAcc");
  const wasOpen=a.classList.contains("open");
  a.classList.add("open");
  if(!wasOpen){
    requestAnimationFrame(()=>{
      const header=document.querySelector(".topbar");
      const top=(header?.getBoundingClientRect().height||62)+10;
      const y=a.getBoundingClientRect().top+window.scrollY-top;
      window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
    });
  }
};
$("locate").onclick=locate;
$("refresh").onclick=loadTimetable;
$("outbound").onclick=()=>setMode("outbound");
$("return").onclick=()=>setMode("inbound");
$("save").onclick=()=>{saveRules();$("settingsAcc").classList.remove("open");applyDirection();};
$("reset").onclick=()=>{
  rules=JSON.parse(JSON.stringify(defaultRules));renderRules();saveRules();
};
renderRules();
locate();
setInterval(()=>{if(currentStation)loadTimetable();},60000);
</script>
</body>
</html>
